name: Crypto Scout Bot

on:
  schedule:
    # Berjalan otomatis setiap 30 menit (menit ke-0 dan ke-30)
    - cron: '0,30 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual lewat tombol "Run workflow"

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scout
        env:
          # DRY_RUN dibuat false agar benar-benar kirim ke Discord
          DRY_RUN: "false"
          # Mengambil dari GitHub Secrets
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # PERHATIKAN BARIS INI: Memanggil nama file Python Anda yang benar
        run: python sideway-scout.py 
